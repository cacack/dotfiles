# Heavy tool set: language runtimes and the tools that need them, layered
# over config.toml when MISE_ENV=desktop (set by `make desktop`). Locked in
# mise.desktop.lock.

[tools]
# Vulnerability scanners for the installed tools (`make security`).
"aqua:aquasecurity/trivy" = "0.76.2"
"aqua:google/osv-scanner" = "2.7.1"
aws-cli = "2.40.3"
azure-cli = "2.92.0"
bitwarden = "2026.10.1"
git-filter-repo = "2.47.0"
# Claude Code updates only through this pin (30_claude.zsh turns its updater off).
"aqua:anthropics/claude-code" = "2.1.325"
# No linux-arm64 build upstream.
"github:david-strejc/claude-powerline-rust" = { version = "1.2.0", os = ["linux/x64", "macos/arm64"] }
# go, node, python and rust also serve Neovim's desktop language servers
# (lua/configs/tools.lua).
go = "1.27.4"
node = "26.13.1"
"pypi:poetry" = "2.5.1"
# Held at 3.13 until pyyaml ships 3.15 wheels; without them mise cannot lock
# the dependencies of the Python tools (azure-cli, yamllint, poetry).
python = "3.13.18"
ruby = "4.0.9"
rust = { version = "1.100.0", profile = "minimal", components = "rustfmt" }
uv = "0.13.9"
yamllint = "1.38.0"

# Neovim's heavy-tier language servers and formatters (lua/configs/tools.lua,
# conform.lua), plus deno and tflint, used from the shell rather than Neovim.
"aqua:astral-sh/ruff" = "0.17.5"
"aqua:hashicorp/terraform-ls" = "0.39.1"
"aqua:mvdan/gofumpt" = "0.12.0"
"aqua:psf/black" = "26.10.1"
"aqua:rust-lang/rust-analyzer" = "2026-11-09"
"aqua:terraform-linters/tflint" = "0.66.0"
deno = "2.9.8"
"github:incu6us/goimports-reviser" = "3.13.2"
# No prebuilt gopls; the go backend builds it with the pinned Go (checksum
# database verified), as Mason did.
"go:golang.org/x/tools/gopls" = "0.24.0"
"npm:bash-language-server" = "5.8.1"
"npm:prettier" = "3.10.1"
"npm:pyright" = "1.1.414"
"npm:typescript-language-server" = "6.1.0"
# 7.x is the native compiler and ships no tsserver, which ts_ls needs.
"npm:typescript" = "6.0.3"
"npm:vscode-langservers-extracted" = "4.10.0"
"npm:yaml-language-server" = "2.0.0"
"pypi:mdformat" = "1.0.0"

# gcloud has no Renovate-supported mise backend; a custom Renovate manager in
# renovate.json tracks the version below.
[tools."http:gcloud"]
version = "594.0.0"
bin_path = "google-cloud-sdk/bin"

[tools."http:gcloud".platforms]
linux-arm64 = { url = "https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-{{version}}-linux-arm.tar.gz" }
linux-x64 = { url = "https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-{{version}}-linux-x86_64.tar.gz" }
macos-arm64 = { url = "https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-{{version}}-darwin-arm.tar.gz" }
