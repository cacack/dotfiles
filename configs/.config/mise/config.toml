# Base tool versions for every install (CLI and desktop), installed with
# `make tools`. Desktop installs add config.desktop.toml (MISE_ENV=desktop).
#
# Every version is exact and locked (with per-platform checksums) in
# mise.lock beside this file; Renovate bumps the pins. After editing run
# `make mise-lock` and commit the lockfile changes with it.

[settings]
locked = true
lockfile_platforms = ["linux-arm64", "linux-x64", "macos-arm64"]

[tools]
"aqua:neovim/neovim" = "0.12.6"
"aqua:tmux/tmux-builds" = "3.8"
direnv = "2.38.2"
fd = "10.5.2"
fzf = "0.75.0"
gh = "2.104.0"
glab = "1.130.0"
lsd = "1.2.0"
# node and python are here for Neovim's Mason language servers.
node = "26.13.1"
# Held at 3.13 until pyyaml ships 3.15 wheels; without them mise cannot lock
# the dependencies of the Python tools (azure-cli, yamllint, poetry).
python = "3.13.18"
ripgrep = "15.2.0"
starship = "1.27.0"
uv = "0.13.8"
zoxide = "0.10.0"
