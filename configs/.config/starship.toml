command_timeout = 1800

[directory]
truncation_length = 3
truncate_to_repo = false

[env_var.STARSHIP_OS_PROMPT]
style = "bold yellow"
symbol = " "
format = "[$symbol $env_value]($style)"

[username]
format = "[$user]($style)@"
show_always = true

[hostname]
ssh_only = false

#[character]
#success_symbol = "❯"
#error_symbol = "✖"

#[aws]
#symbol = "  "
