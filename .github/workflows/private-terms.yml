# Backstop for the local private-terms hooks (README "Private Terms"): scans
# the tree and the new commits for terms in the PRIVATE_TERMS repository
# secret. The check prints only where a term matched, never the term.
name: private-terms

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          # Pull requests from forks get no secrets.
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ -z "$PRIVATE_TERMS" ]; then
            if [ "$FORK" = true ]; then
              echo "::notice::No secrets for fork pull requests; skipping."
              exit 0
            fi
            echo "::error::The PRIVATE_TERMS secret is not set."
            exit 1
          fi
          export GIT_PRIVATE_TERMS="$RUNNER_TEMP/private-terms"
          printf '%s\n' "$PRIVATE_TERMS" >"$GIT_PRIVATE_TERMS"
          check=configs/.config/git.d/hooks/check-private-terms
          status=0
          "$check" tree || status=1
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ]; then
            "$check" range "$BASE..HEAD" || status=1
          fi
          exit "$status"
