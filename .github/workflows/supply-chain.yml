# Supply-chain checks for the pinned tools (README "Supply-Chain Defenses").
# A Renovate bump that leaves the mise lockfiles stale (a custom-manager bump,
# an edited `uv.lock` sidecar) fails `mise-lock` until `make mise-lock` is run
# on the branch and the lockfiles are committed.
# Every job runs in the digest-pinned Ubuntu image the container install test
# uses; actions are pinned to commits. Renovate bumps both.
# `mise-lock`, `security-deps` and `security-tools` are required checks on
# main, so the workflow runs on every pull request and the `changes` job skips
# them (a skip passes) when no supply-chain file changed; a `paths:` filter
# would leave them pending.
name: supply-chain

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  MISE_ENV: desktop
  # mise downloads ~60 tools from GitHub and checks their provenance; the job
  # token lifts GitHub's anonymous API rate limit.
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  # Did this pull request or push touch a supply-chain file? Scheduled and
  # manual runs have no base to diff against, so they always count as relevant.
  changes:
    runs-on: ubuntu-26.04
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          relevant=true
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ] &&
            ! git diff --name-only "$BASE" HEAD | grep -qE '^(configs/\.config/mise/|\.make\.d/(mise|security)\.mk$|\.osv-scanner\.toml$|\.trivyignore\.yaml$|\.github/workflows/supply-chain\.yml$)'; then
            relevant=false
          fi
          echo "relevant=$relevant" | tee -a "$GITHUB_OUTPUT"

  # Fails when a pinned version is missing from the mise lockfiles.
  mise-lock:
    needs: changes
    if: needs.changes.outputs.relevant == 'true' && github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    container: ubuntu:26.04@sha256:d66b366dac61b575bee2aef07e9c26e8070096fbe84a3d4d3eb0da069b5d76db
    steps:
      - run: apt-get update -qq && apt-get install -y -qq ca-certificates curl git make >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make install-mise
      # The desktop pypi tools resolve their locked dependencies with python.
      - run: MISE_CONFIG_DIR="$GITHUB_WORKSPACE/configs/.config/mise" "$HOME/.local/bin/mise" install python
      - run: make mise-lock-check

  # Known vulnerabilities in the pypi and npm tools' locked dependency trees.
  # Needs no tool install, so it runs on pull requests and weekly.
  security-deps:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-26.04
    container: ubuntu:26.04@sha256:d66b366dac61b575bee2aef07e9c26e8070096fbe84a3d4d3eb0da069b5d76db
    steps:
      - run: apt-get update -qq && apt-get install -y -qq ca-certificates curl git make >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make install-mise
      - run: MISE_CONFIG_DIR="$GITHUB_WORKSPACE/configs/.config/mise" "$HOME/.local/bin/mise" install aqua:google/osv-scanner
      - run: make security-deps

  # Installs the whole desktop tool set and scans it with Trivy (~90s): on pull
  # requests that change a supply-chain file, so a vulnerable bump is caught
  # before merge, plus weekly for new CVEs and from the Actions tab
  # (workflow_dispatch). Skipped on pushes to main, which merged PRs scanned.
  security-tools:
    needs: changes
    if: needs.changes.outputs.relevant == 'true' && github.event_name != 'push'
    runs-on: ubuntu-26.04
    container: ubuntu:26.04@sha256:d66b366dac61b575bee2aef07e9c26e8070096fbe84a3d4d3eb0da069b5d76db
    steps:
      - run: apt-get update -qq && apt-get install -y -qq ca-certificates curl git make tar unzip xz-utils libatomic1 >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make install-mise
      - run: MISE_CONFIG_DIR="$GITHUB_WORKSPACE/configs/.config/mise" "$HOME/.local/bin/mise" install
      - run: make security-tools
