# Supply-chain checks for the pinned tools (README "Supply-Chain Defenses").
# Renovate bumps only the configs, so its pull requests fail `mise-lock` until
# `make mise-lock` is run on the branch and the lockfiles are committed.
# Every job runs in the digest-pinned Ubuntu image the container install test
# uses; actions are pinned to commits. Renovate bumps both.
name: supply-chain

on:
  pull_request:
    paths:
      - "configs/.config/mise/**"
      - ".make.d/mise.mk"
      - ".make.d/security.mk"
      - ".osv-scanner.toml"
      - ".trivyignore.yaml"
      - ".github/workflows/supply-chain.yml"
  push:
    branches: [main]
    paths:
      - "configs/.config/mise/**"
      - ".make.d/mise.mk"
      - ".make.d/security.mk"
      - ".osv-scanner.toml"
      - ".trivyignore.yaml"
      - ".github/workflows/supply-chain.yml"
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  MISE_ENV: desktop
  # mise downloads ~60 tools from GitHub and checks their provenance; the job
  # token lifts GitHub's anonymous API rate limit.
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  # Fails when a pinned version is missing from the mise lockfiles.
  mise-lock:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    container: ubuntu:24.04@sha256:73b999393d07f2bf65a40373778a44dc9a6d54ad7718d29247d8ff9413c4d6a8
    steps:
      - run: apt-get update -qq && apt-get install -y -qq ca-certificates curl git make >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make install-mise
      # The desktop pypi tools resolve their locked dependencies with python.
      - run: MISE_CONFIG_DIR="$GITHUB_WORKSPACE/configs/.config/mise" "$HOME/.local/bin/mise" install python
      - run: make mise-lock-check

  # Known vulnerabilities in the pypi and npm tools' locked dependency trees.
  # Needs no tool install, so it runs on pull requests and weekly.
  security-deps:
    runs-on: ubuntu-24.04
    container: ubuntu:24.04@sha256:73b999393d07f2bf65a40373778a44dc9a6d54ad7718d29247d8ff9413c4d6a8
    steps:
      - run: apt-get update -qq && apt-get install -y -qq ca-certificates curl git make >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make install-mise
      - run: MISE_CONFIG_DIR="$GITHUB_WORKSPACE/configs/.config/mise" "$HOME/.local/bin/mise" install aqua:google/osv-scanner
      - run: make security-deps

  # Installs the whole desktop tool set and scans it with Trivy. Too heavy for
  # every pull request: weekly, or from the Actions tab (workflow_dispatch).
  security-tools:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    container: ubuntu:24.04@sha256:73b999393d07f2bf65a40373778a44dc9a6d54ad7718d29247d8ff9413c4d6a8
    steps:
      - run: apt-get update -qq && apt-get install -y -qq ca-certificates curl git make tar unzip xz-utils libatomic1 >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make install-mise
      - run: MISE_CONFIG_DIR="$GITHUB_WORKSPACE/configs/.config/mise" "$HOME/.local/bin/mise" install
      - run: make security-tools
